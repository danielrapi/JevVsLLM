[project]
name = "jev-vs-good-models"
version = "0.1.0"
description = "Benchmark language classification tasks across Jev and one-letter LLM multiple-choice adapters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = [
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

datasets = [
  "requests>=2.31",
]

[project.scripts]
jevbench = "jevbench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
